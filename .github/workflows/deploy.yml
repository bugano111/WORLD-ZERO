name: WORLD ZERO CURRENT LIVE
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: static-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install browser for visual smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Fetch real CC0 PBR ground
        run: |
          mkdir -p public/real-assets
          curl -L --fail --retry 3 -o /tmp/files.json https://api.polyhaven.com/files/forest_floor
          python - <<'PY'
          import json, os, re, urllib.request
          d=json.load(open("/tmp/files.json"))
          found=[]
          def walk(x,p=""):
            if isinstance(x,dict):
              if isinstance(x.get("url"),str): found.append((p,x["url"]))
              for k,v in x.items(): walk(v,p+"/"+str(k))
            elif isinstance(x,list):
              for i,v in enumerate(x): walk(v,p+"/"+str(i))
          walk(d)
          def pick(kind):
            cand=[u for p,u in found if "1k" in (p+" "+u).lower() and kind in (p+" "+u).lower() and re.search(r'\.(jpg|png)(\?|$)',u.lower())]
            if not cand: raise SystemExit("missing "+kind)
            return cand[0]
          for kind in ("diff","nor_gl","rough"):
            u=pick(kind); ext=".png" if ".png" in u.lower().split("?")[0] else ".jpg"; out=f"public/real-assets/forest_floor_{kind}_1k{ext}"
            urllib.request.urlretrieve(u,out); print(out,os.path.getsize(out))
          PY
      - name: Fetch CC0 glTF rock with dependencies
        run: |
          python - <<'PY'
          import json, os, urllib.request
          aid="rock_moss_set_01"; H={"User-Agent":"WORLD-ZERO-Builder/1.0"}
          with urllib.request.urlopen(urllib.request.Request("https://api.polyhaven.com/files/"+aid,headers=H),timeout=90) as r:d=json.load(r)
          node=d.get("gltf",{}).get("1k",{}).get("gltf")
          if not node: raise SystemExit("missing gltf/1k/gltf")
          os.makedirs("public/real-assets/models",exist_ok=True)
          def dl(url,path):
            os.makedirs(os.path.dirname(path),exist_ok=True)
            with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=180) as r,open(path,"wb") as o:o.write(r.read())
            print(path,os.path.getsize(path))
          dl(node["url"],"public/real-assets/models/"+aid+".gltf")
          for rel,info in node.get("include",{}).items(): dl(info["url"],"public/real-assets/models/"+rel)
          PY
      - name: Fetch real CC0 forest vegetation
        run: |
          python - <<'PY'
          import json, os, urllib.request
          H={"User-Agent":"WORLD-ZERO-Builder/1.0"}
          os.makedirs("public/real-assets/models",exist_ok=True)
          def fetch(aid):
            with urllib.request.urlopen(urllib.request.Request("https://api.polyhaven.com/files/"+aid,headers=H),timeout=90) as r:d=json.load(r)
            root=d.get("gltf",{})
            node=(root.get("1k",{}) or root.get("2k",{})).get("gltf")
            if not node: raise SystemExit("missing gltf "+aid)
            def dl(url,path):
              os.makedirs(os.path.dirname(path),exist_ok=True)
              with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=180) as r,open(path,"wb") as o:o.write(r.read())
            dl(node["url"],f"public/real-assets/models/{aid}.gltf")
            for rel,info in node.get("include",{}).items(): dl(info["url"],"public/real-assets/models/"+rel)
          for a in ("shrub_02","weed_plant_02","tree_stump_01"): fetch(a)
          PY
      - name: Fetch hero photoreal tree
        run: |
          python - <<'PY'
          import json, os, urllib.request
          aid="pine_sapling_small"; H={"User-Agent":"WORLD-ZERO-Builder/1.0"}
          with urllib.request.urlopen(urllib.request.Request("https://api.polyhaven.com/files/"+aid,headers=H),timeout=90) as r:d=json.load(r)
          root=d.get("gltf",{}); node=(root.get("1k",{}) or root.get("2k",{})).get("gltf")
          if not node: raise SystemExit("missing tree gltf")
          os.makedirs("public/real-assets/models",exist_ok=True)
          def dl(url,path):
            os.makedirs(os.path.dirname(path),exist_ok=True)
            with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=240) as r,open(path,"wb") as o:o.write(r.read())
          dl(node["url"],"public/real-assets/models/"+aid+".gltf")
          for rel,info in node.get("include",{}).items(): dl(info["url"],"public/real-assets/models/"+rel)
          PY
      - name: Fetch photoreal forest panorama
        run: |
          mkdir -p public/real-assets
          curl -fL --retry 3 "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/mossy_forest_1k.hdr" -o public/real-assets/mossy_forest_panorama.hdr
          test -s public/real-assets/mossy_forest_panorama.hdr
      - name: Fetch real animated human
        run: |
          mkdir -p public/real-assets/models
          curl -fL --retry 3 "https://raw.githubusercontent.com/joeholloway445-maker/Periliminal.Space/main/godot/assets/models/metahuman_player.glb" -o public/real-assets/models/human.glb
          test -s public/real-assets/models/human.glb
      - name: Fetch R158 realistic human candidates
        run: |
          mkdir -p public/real-assets/rocketbox
          curl -fL --retry 3 "https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Avatars/Adults/Male_Adult_04/Export/Male_Adult_04.fbx" -o public/real-assets/rocketbox/M1.fbx
          curl -fL --retry 3 "https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Avatars/Adults/Female_Adult_04/Export/Female_Adult_04.fbx" -o public/real-assets/rocketbox/Z1.fbx
          test -s public/real-assets/rocketbox/M1.fbx
          test -s public/real-assets/rocketbox/Z1.fbx
          curl -fL --retry 3 "https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Animations/all_animations_max_motextr_static/m_idle_breathe_01.max.fbx" -o public/real-assets/rocketbox/M1_idle.fbx
          curl -fL --retry 3 "https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Animations/all_animations_max_motextr_xy/m_walk_neutral.max.fbx" -o public/real-assets/rocketbox/M1_walk.fbx
          curl -fL --retry 3 "https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Animations/all_animations_max_motextr_xy/m_run_neutral.max.fbx" -o public/real-assets/rocketbox/M1_run.fbx
          test -s public/real-assets/rocketbox/M1_idle.fbx
          test -s public/real-assets/rocketbox/M1_walk.fbx
          test -s public/real-assets/rocketbox/M1_run.fbx
          # R167: complete M1 authored skin/clothing/head texture set.
          base="https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Avatars/Adults/Male_Adult_04/Textures"
          for tex in m006_body_color.tga m006_body_normal.tga m006_body_specular.tga m006_head_color.tga m006_head_normal.tga m006_head_specular.tga m006_opacity_color.tga; do
            curl -fL --retry 3 "$base/$tex" -o "public/real-assets/rocketbox/$tex"
            test -s "public/real-assets/rocketbox/$tex"
          done
          # Rocketbox FBX materials reference companion textures. Copy them so the browser loader does not 404.
          for who in Male_Adult_04 Female_Adult_04; do
            mkdir -p "public/real-assets/rocketbox/$who"
            base="https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Avatars/Adults/$who"
            curl -fsSL "$base/Export/" >/dev/null || true
          done
      - run: npm run build
      - name: Typecheck runtime identifiers
        run: npx tsc --noEmit
      - name: Verify real animated human
        run: |
          test -s dist/real-assets/models/human.glb
          echo "human.glb bytes: $(stat -c%s dist/real-assets/models/human.glb)"
      - name: Verify forest panorama
        run: |
          test -s dist/real-assets/mossy_forest_panorama.hdr
      - name: Verify hero tree
        run: |
          test -s dist/real-assets/models/pine_sapling_small.gltf
      - name: Verify vegetation models
        run: |
          test -s dist/real-assets/models/shrub_02.gltf
          test -s dist/real-assets/models/weed_plant_02.gltf
          test -s dist/real-assets/models/tree_stump_01.gltf
      - name: Verify real glTF rock
        run: |
          test -s dist/real-assets/models/rock_moss_set_01.gltf
          test -s dist/real-assets/models/rock_moss_set_01.bin
      - name: Verify bundled PBR files
        run: |
          ls -lh dist/real-assets/
          test -n "$(find dist/real-assets -type f -name 'forest_floor_diff_1k*' -size +10k)"
          test -n "$(find dist/real-assets -type f -name 'forest_floor_nor_gl_1k*' -size +10k)"
          test -n "$(find dist/real-assets -type f -name 'forest_floor_rough_1k*' -size +10k)"
      - name: Verify REALISM 60 release
        run: |
          test -f dist/index.html
          grep -R "LIVING PLANET" dist/assets
          grep -R "ALPINE WILDERNESS" dist/assets
      - name: Stamp current deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("dist/index.html")
          s=p.read_text()
          s=s.replace("</body>",'<div style="position:fixed;left:8px;bottom:8px;z-index:999999;background:#b00020;color:white;padding:8px 10px;border-radius:8px;font:800 12px system-ui">WORLD ZERO · BUILD R102 · CURRENT</div></body>')
          p.write_text(s)
          PY
      - name: Create isolated current-game URL
        run: |
          mkdir -p dist/r102
          cp dist/index.html dist/r102/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path("dist/r102/index.html")
          s=p.read_text()
          s=s.replace('src="./assets/', 'src="../assets/').replace('href="./assets/', 'href="../assets/')
          s=s.replace('src="/WORLD-ZERO/assets/', 'src="../assets/').replace('href="/WORLD-ZERO/assets/', 'href="../assets/')
          s=s.replace("</body>",'<div style="position:fixed;right:8px;top:8px;z-index:999999;background:#005c2b;color:white;padding:8px 10px;border-radius:8px;font:800 12px system-ui">LIVE R102 · CURRENT DEPLOY</div></body>')
          p.write_text(s)
          Path("dist/r102.html").write_text(s)
          # Keep legacy R57 PLAY entry alive, but serve the current working game.
          legacy=Path("dist/r57"); legacy.mkdir(exist_ok=True)
          Path("dist/r57/index.html").write_text(s.replace("LIVE R102","LIVE CURRENT · R102"))
          Path("dist/r57.html").write_text(s.replace("LIVE R102","LIVE CURRENT · R102"))
          # Keep R74 PLAY entry alive and point it at the current verified build.
          r74=Path("dist/r74"); r74.mkdir(exist_ok=True)
          Path("dist/r74/index.html").write_text(s.replace("LIVE R102","LIVE CURRENT · R102"))
          Path("dist/r74.html").write_text(s.replace("LIVE R102","LIVE CURRENT · R102"))
          PY
          grep -q "LIVE R102" dist/r102/index.html
          grep -q "LIVE R102" dist/r102.html
          test -s dist/r57/index.html
          test -s dist/r57.html
          test -s dist/r74/index.html
          test -s dist/r74.html
      - name: Visual smoke test of built game
        run: |
          mkdir -p dist/WORLD-ZERO
          cp -a dist/assets dist/WORLD-ZERO/assets
          cp -a dist/real-assets dist/WORLD-ZERO/real-assets
          python3 -m http.server 4173 --directory dist >/tmp/wz-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:430,height:932},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/r102/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(8000);
            const canvasCount=await page.evaluate(()=>document.querySelectorAll('canvas').length);
            if(canvasCount!==1) throw new Error('WebGL canvas missing');
            const box={width:430,height:932};
            const png=await page.evaluate(()=>{const c=document.querySelector('canvas'); return c&&c.toDataURL('image/png').split(',')[1]});
            if(!png) throw new Error('Canvas capture failed');
            require('fs').writeFileSync('wz-r102-mobile.png',Buffer.from(png,'base64'));
            console.log('visual screenshot created',box,'errors',errors);
            if(errors.some(e=>/webgl|render|failed to load|404/i.test(e))) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Publish visual proof into Pages
        run: |
          mkdir -p dist/proof
          cp wz-r102-mobile.png dist/proof/latest-mobile.png
          cp wz-r102-mobile.png dist/proof/r128-mobile.png
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: wz-r102-visual-proof
          path: wz-r102-mobile.png
          retention-days: 7
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy directly to GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4

# deployment trigger: R102-real-human
