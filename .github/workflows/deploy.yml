name: WORLD ZERO REALISM 10 LIVE
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: static-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify REALISM 10 release
        run: |
          test -f dist/index.html
          grep -R "LIVING PLANET" dist/assets
          grep -R "KŘESAT PAZOURKY" dist/assets
          grep -R "REALISM 13" dist/assets
          grep -R "ZAPNOUT ZVUK" dist/assets
      - name: Publish dist to gh-pages
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
