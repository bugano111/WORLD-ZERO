name: WORLD ZERO REALISM 10 LIVE
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: static-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fetch real CC0 PBR ground
        run: |
          mkdir -p public/real-assets
          curl -L --fail --retry 3 -o /tmp/files.json https://api.polyhaven.com/files/forest_floor
          python - <<'PY'
          import json, os, re, urllib.request
          d=json.load(open("/tmp/files.json"))
          found=[]
          def walk(x,p=""):
            if isinstance(x,dict):
              if isinstance(x.get("url"),str): found.append((p,x["url"]))
              for k,v in x.items(): walk(v,p+"/"+str(k))
            elif isinstance(x,list):
              for i,v in enumerate(x): walk(v,p+"/"+str(i))
          walk(d)
          def pick(kind):
            cand=[u for p,u in found if "1k" in (p+" "+u).lower() and kind in (p+" "+u).lower() and re.search(r'\.(jpg|png)(\?|$)',u.lower())]
            if not cand: raise SystemExit("missing "+kind)
            return cand[0]
          for kind in ("diff","nor_gl","rough"):
            u=pick(kind); ext=".png" if ".png" in u.lower().split("?")[0] else ".jpg"; out=f"public/real-assets/forest_floor_{kind}_1k{ext}"
            urllib.request.urlretrieve(u,out); print(out,os.path.getsize(out))
          PY
      - name: Fetch photoreal 3D forest models
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          os.makedirs("public/real-assets/models",exist_ok=True)
          UA={"User-Agent":"WORLD-ZERO-Builder/1.0"}
          def walk(x,p="",out=None):
            out=[] if out is None else out
            if isinstance(x,dict):
              if isinstance(x.get("url"),str): out.append((p,x["url"]))
              for k,v in x.items(): walk(v,p+"/"+str(k),out)
            elif isinstance(x,list):
              for i,v in enumerate(x): walk(v,p+"/"+str(i),out)
            return out
          for aid in ("tree_small_02","rock_09","tree_stump_01"):
            req=urllib.request.Request("https://api.polyhaven.com/files/"+aid,headers=UA)
            with urllib.request.urlopen(req,timeout=90) as r: d=json.load(r)
            arr=walk(d)
            cand=[(p,u) for p,u in arr if ("1k" in (p+" "+u).lower()) and (".gltf" in u.lower() or ".glb" in u.lower())]
            if not cand: raise SystemExit("No 1K glTF for "+aid)
            # Prefer self-contained GLB, otherwise first glTF asset.
            cand.sort(key=lambda q:(0 if ".glb" in q[1].lower() else 1,len(q[1])))
            p,u=cand[0]
            ext=".glb" if ".glb" in u.lower().split("?")[0] else ".gltf"
            out="public/real-assets/models/"+aid+ext
            req=urllib.request.Request(u,headers=UA)
            with urllib.request.urlopen(req,timeout=180) as r, open(out,"wb") as o:o.write(r.read())
            print(aid,out,os.path.getsize(out),u)
          PY
      - run: npm run build
      - name: Verify bundled PBR files
        run: |
          ls -lh dist/real-assets/
          test -n "$(find dist/real-assets -type f -name 'forest_floor_diff_1k*' -size +10k)"
          test -n "$(find dist/real-assets -type f -name 'forest_floor_nor_gl_1k*' -size +10k)"
          test -n "$(find dist/real-assets -type f -name 'forest_floor_rough_1k*' -size +10k)"
      - name: Verify REALISM 10 release
        run: |
          test -f dist/index.html
          grep -R "LIVING PLANET" dist/assets
          grep -R "KŘESAT PAZOURKY" dist/assets
          grep -R "REALISM 17" dist/assets
          grep -R "ZAPNOUT ZVUK" dist/assets
      - name: Publish dist to gh-pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

# deployment trigger: realism15-pbr
