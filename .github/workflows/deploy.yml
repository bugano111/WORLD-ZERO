name: WORLD ZERO REALISM 10 LIVE
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: static-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fetch real CC0 PBR ground
        run: |
          mkdir -p public/real-assets
          curl -L --fail --retry 3 -o /tmp/files.json https://api.polyhaven.com/files/forest_floor
          python - <<'PY'
          import json, os, re, urllib.request
          d=json.load(open("/tmp/files.json"))
          found=[]
          def walk(x,p=""):
            if isinstance(x,dict):
              if isinstance(x.get("url"),str): found.append((p,x["url"]))
              for k,v in x.items(): walk(v,p+"/"+str(k))
            elif isinstance(x,list):
              for i,v in enumerate(x): walk(v,p+"/"+str(i))
          walk(d)
          def pick(kind):
            cand=[u for p,u in found if "1k" in (p+" "+u).lower() and kind in (p+" "+u).lower() and re.search(r'\.(jpg|png)(\?|$)',u.lower())]
            if not cand: raise SystemExit("missing "+kind)
            return cand[0]
          for kind in ("diff","nor_gl","rough"):
            u=pick(kind); ext=".png" if ".png" in u.lower().split("?")[0] else ".jpg"; out=f"public/real-assets/forest_floor_{kind}_1k{ext}"
            urllib.request.urlretrieve(u,out); print(out,os.path.getsize(out))
          PY
      - name: Fetch CC0 glTF rock with dependencies
        run: |
          python - <<'PY'
          import json, os, urllib.request
          aid="rock_moss_set_01"; H={"User-Agent":"WORLD-ZERO-Builder/1.0"}
          with urllib.request.urlopen(urllib.request.Request("https://api.polyhaven.com/files/"+aid,headers=H),timeout=90) as r:d=json.load(r)
          node=d.get("gltf",{}).get("1k",{}).get("gltf")
          if not node: raise SystemExit("missing gltf/1k/gltf")
          os.makedirs("public/real-assets/models",exist_ok=True)
          def dl(url,path):
            os.makedirs(os.path.dirname(path),exist_ok=True)
            with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=180) as r,open(path,"wb") as o:o.write(r.read())
            print(path,os.path.getsize(path))
          dl(node["url"],"public/real-assets/models/"+aid+".gltf")
          for rel,info in node.get("include",{}).items(): dl(info["url"],"public/real-assets/models/"+rel)
          PY
      - name: Fetch real CC0 forest vegetation
        run: |
          python - <<'PY'
          import json, os, urllib.request
          H={"User-Agent":"WORLD-ZERO-Builder/1.0"}
          os.makedirs("public/real-assets/models",exist_ok=True)
          def fetch(aid):
            with urllib.request.urlopen(urllib.request.Request("https://api.polyhaven.com/files/"+aid,headers=H),timeout=90) as r:d=json.load(r)
            root=d.get("gltf",{})
            node=(root.get("1k",{}) or root.get("2k",{})).get("gltf")
            if not node: raise SystemExit("missing gltf "+aid)
            def dl(url,path):
              os.makedirs(os.path.dirname(path),exist_ok=True)
              with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=180) as r,open(path,"wb") as o:o.write(r.read())
            dl(node["url"],f"public/real-assets/models/{aid}.gltf")
            for rel,info in node.get("include",{}).items(): dl(info["url"],"public/real-assets/models/"+rel)
          for a in ("shrub_02","weed_plant_02","tree_stump_01"): fetch(a)
          PY
      - name: Fetch hero photoreal tree
        run: |
          python - <<'PY'
          import json, os, urllib.request
          aid="tree_small_02"; H={"User-Agent":"WORLD-ZERO-Builder/1.0"}
          with urllib.request.urlopen(urllib.request.Request("https://api.polyhaven.com/files/"+aid,headers=H),timeout=90) as r:d=json.load(r)
          root=d.get("gltf",{}); node=(root.get("1k",{}) or root.get("2k",{})).get("gltf")
          if not node: raise SystemExit("missing tree gltf")
          os.makedirs("public/real-assets/models",exist_ok=True)
          def dl(url,path):
            os.makedirs(os.path.dirname(path),exist_ok=True)
            with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=240) as r,open(path,"wb") as o:o.write(r.read())
          dl(node["url"],"public/real-assets/models/"+aid+".gltf")
          for rel,info in node.get("include",{}).items(): dl(info["url"],"public/real-assets/models/"+rel)
          PY
      - name: Fetch photoreal forest panorama
        run: |
          mkdir -p public/real-assets
          curl -fL --retry 3 "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/mossy_forest_1k.hdr" -o public/real-assets/mossy_forest_panorama.hdr
          test -s public/real-assets/mossy_forest_panorama.hdr
      - run: npm run build
      - name: Verify forest panorama
        run: |
          test -s dist/real-assets/mossy_forest_panorama.hdr
      - name: Verify hero tree
        run: |
          test -s dist/real-assets/models/tree_small_02.gltf
      - name: Verify vegetation models
        run: |
          test -s dist/real-assets/models/shrub_02.gltf
          test -s dist/real-assets/models/weed_plant_02.gltf
          test -s dist/real-assets/models/tree_stump_01.gltf
      - name: Verify real glTF rock
        run: |
          test -s dist/real-assets/models/rock_moss_set_01.gltf
          test -s dist/real-assets/models/rock_moss_set_01.bin
      - name: Verify bundled PBR files
        run: |
          ls -lh dist/real-assets/
          test -n "$(find dist/real-assets -type f -name 'forest_floor_diff_1k*' -size +10k)"
          test -n "$(find dist/real-assets -type f -name 'forest_floor_nor_gl_1k*' -size +10k)"
          test -n "$(find dist/real-assets -type f -name 'forest_floor_rough_1k*' -size +10k)"
      - name: Verify REALISM 10 release
        run: |
          test -f dist/index.html
          grep -R "LIVING PLANET" dist/assets
          grep -R "KŘESAT PAZOURKY" dist/assets
          grep -R "REALISM 40 · IPHONE STABLE" dist/assets
          grep -R "ZAPNOUT ZVUK" dist/assets
      - name: Stamp immutable R53 deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("dist/index.html")
          s=p.read_text()
          s=s.replace("</body>",'<div style="position:fixed;left:8px;bottom:8px;z-index:999999;background:#b00020;color:white;padding:8px 10px;border-radius:8px;font:800 12px system-ui">WORLD ZERO · REALISM 40 · IPHONE STABLE</div></body>')
          p.write_text(s)
          PY
          rm -rf /tmp/worldzero-r53
          mkdir -p /tmp/worldzero-r53
          cp -a dist/. /tmp/worldzero-r53/
          mkdir -p dist/r53
          cp -a /tmp/worldzero-r53/. dist/r53/
          sed -i 's#src="/WORLD-ZERO/#src="/WORLD-ZERO/r53/#g; s#href="/WORLD-ZERO/#href="/WORLD-ZERO/r53/#g' dist/r53/index.html
      - name: Create stable play URL R53
        run: |
          cp dist/index.html dist/play.html
          test -s dist/play.html
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy directly to GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4

# deployment trigger: realism15-pbr
